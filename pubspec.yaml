name: cartas
description: Estúdio offline-first para criação, gestão e exportação de cartas de jogos personalizadas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  csv: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  uuid: ^4.5.1
  intl: any
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  share_plus: ^11.1.0
  google_fonts: ^6.3.2
  collection: ^1.19.1
  xml: ^6.5.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
